name: Build Klock Android APK & Widgets

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Android Project
        run: |
          mkdir -p android-project/app/src/main/java/com/klock/vedic
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/res/xml
          mkdir -p android-project/app/src/main/assets

          cat << 'EOF' > android-project/settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "KlockVedic"
          include(":app")
          EOF

          cat << 'EOF' > android-project/build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > android-project/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.klock.vedic"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.klock.vedic"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <application android:allowBackup="true" android:label="Klock" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".CompactKlockWidget" android:exported="true" android:label="Klock Compact (2x1)">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info_compact" />
                  </receiver>
                  <receiver android:name=".MediumKlockWidget" android:exported="true" android:label="Klock Medium (4x2)">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info_medium" />
                  </receiver>
                  <receiver android:name=".LargeKlockWidget" android:exported="true" android:label="Klock Large (4x3)">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info_large" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/klock/vedic/MainActivity.kt
          package com.klock.vedic
          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; allowFileAccess = true }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(WebViewWidgetBridge(this), "AndroidWidgetBridge")
                  webView.loadUrl("file:///android_asset/index.html")
              }
              override fun onPause() { super.onPause(); KlockWidgetUpdater.updateAllWidgets(this) }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/klock/vedic/VedicTimeCalculator.kt
          package com.klock.vedic
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.os.Build
          import android.webkit.JavascriptInterface
          import org.json.JSONObject
          import java.util.Calendar
          data class VedicSnapshot(val ghati: Int, val pala: Int, val vipala: Int, val muhurta: Int, val progressPercent: Int, val civilTimeFormatted: String, val anchorLabel: String)
          object VedicTimeCalculator {
              private const val PREFS_NAME = "klock_native_prefs"
              private const val KEY_STATE_JSON = "state_json"
              fun saveConfigJson(context: Context, json: String) { context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putString(KEY_STATE_JSON, json).apply(); KlockWidgetUpdater.updateAllWidgets(context) }
              fun computeNow(context: Context): VedicSnapshot {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val rawJson = prefs.getString(KEY_STATE_JSON, "{}") ?: "{}"
                  val config = try { JSONObject(rawJson) } catch (_: Exception) { JSONObject() }
                  val anchorMode = config.optString("anchorMode", "civil")
                  val manualSunrise = config.optString("manualSunrise", "")
                  val cal = Calendar.getInstance()
                  val hour = cal.get(Calendar.HOUR_OF_DAY)
                  val minute = cal.get(Calendar.MINUTE)
                  val second = cal.get(Calendar.SECOND)
                  val millis = cal.get(Calendar.MILLISECOND)
                  val civilElapsedMs = hour * 3600000L + minute * 60000L + second * 1000L + millis
                  var anchorOffsetMs = 0L; var anchorLabel = "Civil Anchor"
                  if (anchorMode == "sunrise") {
                      anchorOffsetMs = if (manualSunrise.matches(Regex("\\d{2}:\\d{2}"))) { val parts = manualSunrise.split(":"); (parts[0].toLong() * 3600L + parts[1].toLong() * 60L) * 1000L } else { 6L * 3600000L }
                      anchorLabel = "Sunrise Anchor"
                  }
                  val elapsed = ((civilElapsedMs - anchorOffsetMs) % 86400000L + 86400000L) % 86400000L
                  val ghati = (elapsed / 1440000L).toInt()
                  val remGhati = elapsed % 1440000L
                  val pala = (remGhati / 24000L).toInt()
                  val vipala = ((remGhati % 24000L) / 400L).toInt()
                  val muhurta = (elapsed / 2880000L).toInt() + 1
                  val pct = ((elapsed * 100L) / 86400000L).toInt()
                  return VedicSnapshot(ghati, pala, vipala, muhurta, pct, String.format("%02d:%02d", hour, minute), anchorLabel)
              }
          }
          class WebViewWidgetBridge(private val context: Context) {
              @JavascriptInterface fun syncConfiguration(json: String) { VedicTimeCalculator.saveConfigJson(context, json) }
              @JavascriptInterface fun requestPinWidget(variant: String) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val mgr = context.getSystemService(AppWidgetManager::class.java)
                      if (mgr != null && mgr.isRequestPinAppWidgetSupported) {
                          val provider = ComponentName(context, when(variant.lowercase()) { "compact" -> CompactKlockWidget::class.java; "large" -> LargeKlockWidget
